name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        working-directory: Plugin
        run: dotnet build "[LR] Module - FakeRank.csproj" -c Release -o ../out
      - name: Package
        run: |
          dest="dist/addons/counterstrikesharp/plugins/[LR] Module - FakeRank"
          mkdir -p "$dest"
          cp "out/[LR] Module - FakeRank.dll" "$dest/"
          cd dist && zip -r ../LR-FakeRank.zip addons
      - uses: actions/upload-artifact@v4
        with:
          name: LR-FakeRank
          path: dist
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LR-FakeRank.zip
          generate_release_notes: true
